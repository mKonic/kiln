[package]
name = "kiln"
version = "0.1.0"
edition = "2021"
description = "Safe Rust over the kiln C ABI: closures for callbacks, keys from the call site"

[dependencies]
kiln-sys = { path = "../kiln-sys" }

[[example]]
name = "notes"

# The same app as an Android library (KilnActivity loads it): `cargo build --example notes-lib --target x86_64-linux-android`.
[[example]]
name = "notes-lib"
crate-type = ["cdylib"]
