<!-- Code highlighting: Prism (it colours calls, types and literals, as GitHub's own view does;
     Rouge's C++ lexer leaves most of a snippet as plain names). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" data-manual></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-kotlin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script>document.addEventListener('DOMContentLoaded', function () { Prism.highlightAll(); });</script>
<style>
  /* GitHub's light palette (Primer prettylights). */
  .markdown-body pre code { color: #1f2328; }
  .token.comment, .token.prolog, .token.cdata { color: #59636e; }
  .token.keyword, .token.directive, .token.important, .token.atrule, .token.rule { color: #cf222e; }
  .token.string, .token.char, .token.attr-value, .token.regex, .token.url { color: #0a3069; }
  .token.number, .token.boolean, .token.constant, .token.macro, .token.variable, .token.property { color: #0550ae; }
  .token.function { color: #8250df; }
  .token.class-name, .token.builtin, .token.namespace { color: #953800; }
  .token.tag, .token.selector { color: #116329; }
  .token.attr-name { color: #0550ae; }
  .token.operator, .token.punctuation { color: #1f2328; }
  .token.directive-hash, .token.macro .token.directive-hash { color: #cf222e; }
</style>
