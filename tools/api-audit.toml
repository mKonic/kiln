'^WindowInfoTracker\.(registerWindowEngagementInfoListener|unregisterWindowEngagementInfoListener|windowEngagementInfo)$' = "window engagement (XR / connected displays): not on phones"
'^component\d+$' = "Kotlin destructuring (componentN): C++ reads the fields"
'^(ContextAware|ContextAwareHelper|OnContextAvailableListener|withContextAvailable|ComponentActivity\.(add|remove)OnContextAvailableListener|ComponentActivity\.peekAvailableContext)$' = "Android Context availability; kiln_main runs with everything set up"
'^ComponentActivity\.(addMenuProvider|removeMenuProvider|invalidateMenu|initializeViewTreeOwners)$' = "the View system's options menu and view-tree owners"
'^SavedState(Reader|Writer)\.\w+$' = "Bundle accessors by type: rt::SavedValue is a typed value, read with std::get and made from the value"
"^(ClassDiscriminatorMode|SavedStateConfiguration|SavedStateContainer|SavedStateSerializer|JavaSerializableSerializer|ParcelableSerializer|SizeSerializer|SizeFSerializer|SparseArraySerializer|MutableStateFlowSerializer|MutableStateSerializer|SnapshotState(List|Map|Set)Serializer|Builder\\.(classDiscriminatorMode|encodeDefaults|serializersModule)|getKotlinSerializable|putKotlinSerializable|encodeToSavedState|decodeFromSavedState|(SavedStateRegistry|SavedStateHandle)\\.(asContainer|getOrCreateContainer))$" = "kotlinx.serialization into a SavedState: kiln saves values through Savers (rt::SavedValue), with no serialization framework"
