# tools/api-audit's triage: Compose names that kiln spells differently, and names that do not
# apply to kiln. Keys are Compose names (case does not matter).

# The androidx modules kiln follows (directories holding api/current.txt).
modules = [
    "compose/runtime/runtime",
    "compose/runtime/runtime-saveable",
    "compose/ui/ui-unit",
    "compose/ui/ui-geometry",
    "compose/ui/ui-graphics",
    "compose/ui/ui-text",
    "compose/ui/ui",
    "compose/animation/animation-core",
    "compose/animation/animation",
    "compose/foundation/foundation-layout",
    "compose/foundation/foundation",
    "compose/material3/material3",
    "compose/material3/material3-ripple",
    "compose/material3/adaptive/adaptive",
    "compose/material3/adaptive/adaptive-layout",
    "compose/material3/adaptive/adaptive-navigation",
    "compose/material3/adaptive/adaptive-navigation3",
    "compose/material3/material3-adaptive-navigation-suite",
    "navigation3/navigation3-runtime",
    "navigation3/navigation3-ui",
    "navigation/navigation-compose",
    "navigationevent/navigationevent-compose",
    "graphics/graphics-shapes",
    "lifecycle/lifecycle-common",
    "lifecycle/lifecycle-runtime",
    "lifecycle/lifecycle-runtime-compose",
    "lifecycle/lifecycle-viewmodel",
    "lifecycle/lifecycle-viewmodel-compose",
    "lifecycle/lifecycle-viewmodel-navigation3",
    "lifecycle/lifecycle-viewmodel-savedstate",
    "lifecycle/lifecycle-process",
    "activity/activity | ^(ComponentActivity|ComponentDialog|OnBackPressed\\w*|BackEventCompat|EdgeToEdge|SystemBarStyle|FullyDrawnReporter\\w*|ActivityResult\\w*|PickVisualMediaRequest\\w*|ContextAware\\w*|OnContextAvailableListener)(\\.|$)",
    "activity/activity-compose",
    "savedstate/savedstate",
    "savedstate/savedstate-compose",
    "paging/paging-common",
    "paging/paging-compose",
    "datastore/datastore-core",
    "datastore/datastore-preferences-core",
    "datastore/datastore-preferences",
    "work/work-runtime",
    "glance/glance",
    "glance/glance-appwidget",
    # SupportSQLite* (and SimpleSQLiteQuery) wrap the platform's android.database.sqlite; kiln uses
    # the bundled driver (sqlite::Connection) everywhere, as androidx's KMP sqlite does.
    "sqlite/sqlite | ^(?!Support|SimpleSQLiteQuery)",
    "room3/room3-runtime",
    "core/core | ^(Notification\\w*Compat|NotificationChannel\\w*Compat|Person|AlarmManagerCompat|ShareCompat|RemoteInput|FileProvider|ShortcutInfoCompat|ShortcutManagerCompat|LocusIdCompat|IconCompat|LocaleListCompat|HapticFeedbackConstantsCompat)(\\.|$)",
    "core/core-splashscreen",
    "biometric/biometric",
    "browser/browser | ^CustomTabs",
    "window/window | ^(WindowInfoTracker|WindowLayoutInfo|FoldingFeature|DisplayFeature|WindowMetrics\\w*)(\\.|$)",
    "compose/ui/ui-test",
    "appcompat/appcompat | ^AppCompatDelegate(\\.|$)",
    "media3: | ^(Player|MediaItem|MediaMetadata|PlaybackParameters|AudioAttributes|PlaybackException|Tracks|VideoSize|ExoPlayer|MediaSession|MediaSessionService|MediaNotification)(\\.|$)",
]

