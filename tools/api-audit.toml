# room3 without its compiler: what the annotation processor generates or consumes.
AutoMigrationSpec = "auto migrations are generated by Room's compiler from exported schemas; kiln has no compiler (write the Migration)"
"Builder.addAutoMigrationSpec" = "see AutoMigrationSpec"
RoomDatabaseConstructor = "generated by Room's compiler"
"Builder.addColumnTypeConverter" = "type converters are applied by generated DAO code; kiln's queries convert in place"
"Builder.addDaoReturnTypeConverter" = "see addColumnTypeConverter"
"Room.MASTER_TABLE_NAME" = "the schema identity table needs the compiler's schema hash; kiln checks no identity (documented in Database.h)"
# One process: kiln apps do not share a database across processes.
MultiInstanceInvalidationService = "cross-process invalidation; kiln apps open a database from one process"
"Builder.enableMultiInstanceInvalidation" = "see MultiInstanceInvalidationService"
"Builder.setMultiInstanceInvalidationServiceIntent" = "see MultiInstanceInvalidationService"
# Tuning without behaviour of its own.
"Builder.setPreparedStatementCacheSize" = "a statement cache is a speed knob; kiln prepares each statement (results are the same)"
"Builder.setInMemoryTrackingMode" = "the invalidation log is always a TEMP table in memory (Room's default)"

